name: validate

# The one check this repository actually enforces. CLAUDE.md and CONTRIBUTING.md
# tell contributors to run `claude plugin validate` before opening a PR; this is
# the mechanism that makes that a gate rather than a request.

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  plugin:
    name: claude plugin validate --strict
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install Claude Code CLI
        run: |
          npm install -g @anthropic-ai/claude-code
          claude --version

      - name: Marketplace manifest
        run: claude plugin validate .claude-plugin/marketplace.json --strict

      # Validating the plugin manifest also validates every component the
      # plugin ships (skills, agents, root CLAUDE.md), so this is the one step
      # that covers the whole plugin. It is held to strict terms with one
      # warning accepted on purpose: the root CLAUDE.md governs work on this
      # repository (see CLAUDE.md, first paragraph) and is deliberately not
      # shipped as plugin context. Any other warning or error fails the job.
      - name: Plugin manifest and components (strict, one accepted warning)
        run: |
          set -o pipefail
          claude plugin validate .claude-plugin/plugin.json 2>&1 | tee report.txt
          # Findings are the "❯ <path>: <message>" lines. Strip the one accepted
          # warning; anything left - warning or error - fails the job.
          unexpected=$(grep '❯' report.txt | grep -v 'CLAUDE.md at the plugin root is not loaded as project context' || true)
          if [ -n "$unexpected" ]; then
            echo "::error::Unexpected validation findings:"
            echo "$unexpected"
            exit 1
          fi
          grep -q 'Validation passed' report.txt

  drift-script:
    name: Test-PracticeDrift.ps1 exit-code contract
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # The script documents three exit codes and check-practice-drift relies on
      # them. Each is exercised here, so the contract is enforced, not asserted.
      - name: Exit codes
        shell: pwsh
        run: |
          $script = './scripts/Test-PracticeDrift.ps1'
          $tmp = New-Item -ItemType Directory -Path (Join-Path ([IO.Path]::GetTempPath()) ([guid]::NewGuid()))
          'hello' | Set-Content -NoNewline (Join-Path $tmp 'art.md')
          $hash = (Get-FileHash (Join-Path $tmp 'art.md') -Algorithm SHA256).Hash.ToLowerInvariant()
          @{ practice_id = 'ci'; phase = 'live'; artifacts = @(@{ path = 'art.md'; sha256 = $hash; owner = 'ci'; review_by = '2999-01-01' }) } |
            ConvertTo-Json -Depth 5 | Set-Content (Join-Path $tmp 'ok.json')
          '{bad' | Set-Content (Join-Path $tmp 'bad.json')

          $cases = @(
            @{ Manifest = (Join-Path $tmp 'ok.json');                  Want = 0; Why = 'everything matches' }
            @{ Manifest = './adoption/templates/practice-manifest.json'; Want = 1; Why = 'template artifact is missing on disk' }
            @{ Manifest = (Join-Path $tmp 'missing.json');             Want = 2; Why = 'manifest not found' }
            @{ Manifest = (Join-Path $tmp 'bad.json');                 Want = 2; Why = 'manifest is not JSON' }
          )
          $failed = $false
          foreach ($c in $cases) {
            & pwsh -NoProfile -File $script -Manifest $c.Manifest *> $null
            $got = $LASTEXITCODE
            $mark = if ($got -eq $c.Want) { 'ok  ' } else { 'FAIL'; $failed = $true }
            Write-Host "$mark exit $got (want $($c.Want)) - $($c.Why)"
          }
          # The last native call above left $LASTEXITCODE at 2, and the runner's
          # pwsh wrapper propagates it unless the step exits explicitly.
          if ($failed) { exit 1 } else { exit 0 }
